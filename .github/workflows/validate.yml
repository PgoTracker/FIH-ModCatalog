# Comprueba mods.json en cada PR y en cada cambio de main.
# Va con pull_request (no pull_request_target): el código de un PR de un fork no recibe secretos ni permisos de escritura.
name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate mods.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: python3 scripts/validate.py
